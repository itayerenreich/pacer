[project]
name = "pacer"
version = "0.1.0"
description = "A privacy-first assistant backend for the staff of a pre-military academy: trainees, goals, approvals, and AI that proposes while people decide"
readme = "README.md"
authors = [
    { name = "itayerenreich", email = "itayeren@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.143.1",
    "litellm==1.104.2",
    "pgvector==0.5.0",
    "pypdf==6.19.0",
    "python-docx==1.2.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.1.3",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
pacer = "pacer:main"

[project.optional-dependencies]
audio = [
    "faster-whisper==1.2.1",
]

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "mypy==1.18.2",
    "pytest>=9.1.1",
    "testcontainers[postgres]>=4.15.0",
]

[tool.pytest.ini_options]
markers = [
    "integration: needs Docker (runs against a real PostgreSQL container)",
    "llm: calls a real language model; skipped unless run with --run-llm",
]
filterwarnings = [
    # litellm's own type definitions trigger this pydantic notice; it is not about our code
    "ignore:Item .* is using the `ReadOnly` qualifier:UserWarning",
]

[tool.uv]
# Supply-chain cooldown for the optional audio stack: never resolve a release younger than about
# two weeks (a compromised release is usually caught and pulled within days; see the LiteLLM pin).
exclude-newer-package = { ctranslate2 = "2026-09-30T00:00:00Z", onnxruntime = "2026-09-30T00:00:00Z", numpy = "2026-09-30T00:00:00Z", av = "2026-09-30T00:00:00Z", faster-whisper = "2026-09-30T00:00:00Z" }

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# pyflakes, pycodestyle errors, import order, bugbear, pyupgrade, simplifications
select = ["F", "E", "W", "I", "B", "UP", "SIM"]
ignore = [
    "SIM905",  # a word list written as one string and .split() reads better than 50 quoted words
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # long Hebrew sample sentences and parametrize tables read better on one line

[tool.mypy]
python_version = "3.12"
files = ["src"]
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["litellm.*", "faster_whisper.*", "testcontainers.*"]
ignore_missing_imports = true
