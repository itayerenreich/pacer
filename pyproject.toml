[project]
name = "pacer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "itayerenreich", email = "itayeren@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.1.3",
]

[project.scripts]
pacer = "pacer:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
