[project]
name = "pacer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "itayerenreich", email = "itayeren@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.143.1",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.1.3",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
pacer = "pacer:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "testcontainers[postgres]>=4.15.0",
]

[tool.pytest.ini_options]
markers = [
    "integration: needs Docker (runs against a real PostgreSQL container)",
]
